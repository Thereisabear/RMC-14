- type: entity
  id: CMSurgeryStepBase
  categories: [ HideSpawnMenu ]
  components:
  - type: CMSurgeryStep

- type: entity
  parent: CMSurgeryStepBase
  id: CMSurgeryStepOpenIncisionScalpel
  name: Cut with a scalpel
  components:
  - type: CMSurgeryStep
    delay: 2
    tool:
    - type: CMScalpel
    - type: RMCSurgeryBayonet
    - type: RMCSurgeryKitchenKnife
    - type: RMCSurgeryThrowingKnife
    - type: RMCSurgeryGlassShard
    toolMultipliers: RMCIncisionToolSpeeds
    add:
    - type: CMIncisionOpen
  - type: Sprite
    sprite: _RMC14/Objects/Medical/Surgery/scalpel.rsi
    state: scalpel
  - type: CMSurgeryStepBleedEffect
    damage: 10
  - type: CMSurgeryStepEmoteEffect

- type: entity
  parent: CMSurgeryStepBase
  id: CMSurgeryStepClampBleeders
  name: Clamp the bleeders
  components:
  - type: CMSurgeryStep
    delay: 2
    tool:
    - type: CMHemostat
    - type: RMCSurgeryWirecutter
    - type: RMCSurgeryCableCoil
    toolMultipliers: RMCClampBleedersToolSpeeds
    add:
    - type: CMBleedersClamped
  - type: Sprite
    sprite: _RMC14/Objects/Medical/Surgery/hemostat.rsi
    state: hemostat
  - type: CMSurgeryClampBleedEffect

- type: entity
  parent: CMSurgeryStepBase
  id: CMSurgeryStepRetractSkin
  name: Retract the skin
  components:
  - type: CMSurgeryStep
    delay: 2
    tool:
    - type: CMRetractor
    - type: CMHemostat
    - type: CMScalpel
    - type: RMCSurgeryCrowbar
    - type: RMCSurgeryWirecutter
    - type: RMCSurgeryFork
    - type: RMCSurgeryBayonet
    - type: RMCSurgeryKitchenKnife
    - type: RMCSurgeryThrowingKnife
    - type: RMCSurgeryGlassShard
    # TODO improvised: maintenance jack
    toolMultipliers: RMCRetractToolSpeeds
    add:
    - type: CMSkinRetracted
  - type: Sprite
    sprite: _RMC14/Objects/Medical/Surgery/retractor.rsi
    state: retractor

- type: entity
  parent: CMSurgeryStepBase
  id: CMSurgeryStepSawBones
  name: Saw through bones
  components:
  - type: CMSurgeryStep
    delay: 4
    tool:
    - type: CMBoneSaw
    - type: RMCSurgeryBayonet
    - type: RMCSurgeryFireAxe
    - type: RMCSurgeryMachete
    - type: RMCSurgeryHatchet
    - type: RMCSurgeryButcherKnife
    toolMultipliers: RMCSawToolSpeeds
    add:
    - type: CMRibcageSawed
  - type: Sprite
    sprite: _RMC14/Objects/Medical/Surgery/saw.rsi
    state: saw
  - type: CMSurgeryStepEmoteEffect

- type: entity
  parent: CMSurgeryStepBase
  id: CMSurgeryStepPriseOpenBones
  name: Prise the bones open
  components:
  - type: CMSurgeryStep
    delay: 2
    tool:
    - type: CMRetractor
    - type: RMCSurgeryCrowbar
    toolMultipliers: RMCPryEncasedToolSpeeds
    add:
    - type: CMRibcageOpen
  - type: Sprite
    sprite: _RMC14/Objects/Medical/Surgery/retractor.rsi
    state: retractor

- type: entity
  parent: CMSurgeryStepBase
  id: CMSurgeryStepCutLarvaRoots
  name: Cut larva roots
  components:
  - type: CMSurgeryStep
    skill: 2
    tool:
    - type: CMScalpel
    - type: RMCSurgeryBayonet
    - type: RMCSurgeryKitchenKnife
    - type: RMCSurgeryThrowingKnife
    - type: RMCSurgeryGlassShard
    toolMultipliers: RMCIncisionToolSpeeds
  - type: CMSurgeryCutLarvaRootsStep
  - type: Sprite
    sprite: _RMC14/Objects/Medical/Surgery/scalpel.rsi
    state: scalpel
  - type: CMSurgeryOperatingTableCondition

- type: entity
  parent: CMSurgeryStepBase
  id: CMSurgeryStepRemoveLarva
  name: Remove larva
  components:
  - type: CMSurgeryStep
    skill: 2
    tool:
    - type: CMHemostat
    - type: RMCSurgeryWirecutter
    - type: RMCSurgeryFork
    toolMultipliers: RMCPinchToolSpeeds
    bodyRemove:
    - type: VictimInfected
  - type: Sprite
    sprite: _RMC14/Objects/Medical/Surgery/hemostat.rsi
    state: hemostat
  - type: CMSurgeryOperatingTableCondition
  - type: RMCSurgeryStepLarvaEffect

- type: entity
  parent: CMSurgeryStepBase
  id: CMSurgeryStepCloseBones
  name: Close bones
  components:
  - type: CMSurgeryStep
    delay: 2
    tool:
    - type: CMRetractor
    - type: RMCSurgeryCrowbar
    toolMultipliers: RMCPryEncasedToolSpeeds
    remove:
    - type: CMRibcageOpen
  - type: Sprite
    sprite: _RMC14/Objects/Medical/Surgery/retractor.rsi
    state: retractor

- type: entity
  parent: CMSurgeryStepBase
  id: CMSurgeryStepMendRibcage
  name: Mend ribcage
  components:
  - type: CMSurgeryStep
    delay: 3
    tool:
    - type: CMBoneGel
    - type: RMCSurgeryScrewdriver
    toolMultipliers: RMCBoneMendToolSpeeds
    remove:
    - type: CMRibcageSawed
  - type: Sprite
    sprite: _RMC14/Objects/Medical/Surgery/bone_gel.rsi
    state: bone-gel

- type: entity
  parent: CMSurgeryStepBase
  id: CMSurgeryStepCloseIncision
  name: Close incision
  components:
  - type: CMSurgeryStep
    delay: 2
    tool:
    - type: CMCautery
    - type: RMCSurgeryCigarette
    - type: RMCSurgeryLighter
    - type: RMCSurgeryWelder
    toolMultipliers: RMCCauterizeToolSpeeds
    remove:
    - type: CMSkinRetracted
    - type: CMBleedersClamped
    - type: CMIncisionOpen
  - type: Sprite
    sprite: _RMC14/Objects/Medical/Surgery/cautery.rsi
    state: cautery
  - type: CMSurgeryStepEmoteEffect

- type: entity
  parent: CMSurgeryStepBase
  id: RMCSurgeryCutExoskeleton
  name: Cut exoskeleton carapace
  components:
  - type: CMSurgeryStep
    skill: 2
    delay: 4
    tool:
    - type: CMBoneSaw
    - type: RMCSurgeryFireAxe
    - type: RMCSurgeryMachete
    - type: RMCSurgeryHatchet
    - type: RMCSurgeryBayonet
    - type: RMCSurgeryButcherKnife
    toolMultipliers: RMCSeverBoneToolSpeeds
    add:
    - type: RMCXenoOpen
  - type: Sprite
    sprite: _RMC14/Objects/Medical/Surgery/saw.rsi
    state: saw

- type: entity
  parent: CMSurgeryStepBase
  id: RMCSurgeryOpenExoskeleton
  name: Pry exoskeleton open
  components:
  - type: CMSurgeryStep
    skill: 2
    delay: 2
    tool:
    - type: CMRetractor
    - type: RMCSurgeryCrowbar
    toolMultipliers: RMCPryEncasedToolSpeeds
    add:
    - type: RMCXenoPryed
  - type: Sprite
    sprite: _RMC14/Objects/Medical/Surgery/retractor.rsi
    state: retractor

- type: entity
  parent: CMSurgeryStepBase
  id: RMCSurgerySevereXenoConnections
  name: Sever organ connections
  components:
  - type: CMSurgeryStep
    skill: 2
    delay: 4
    tool:
    - type: CMScalpel
    - type: RMCSurgeryBayonet
    - type: RMCSurgeryKitchenKnife
    - type: RMCSurgeryThrowingKnife
    - type: RMCSurgeryGlassShard
    toolMultipliers: RMCIncisionToolSpeeds
    add:
    - type: RMCXenoCut
  - type: Sprite
    sprite: _RMC14/Objects/Medical/Surgery/scalpel.rsi
    state: scalpel

- type: entity
  parent: CMSurgeryStepBase
  id: RMCSurgeryRemoveXenoOrgan
  name: Remove xenonid organ
  components:
  - type: CMSurgeryStep
    skill: 2
    delay: 3
    tool:
    - type: CMHemostat
    - type: RMCSurgeryWirecutter
    - type: RMCSurgeryFork
    toolMultipliers: RMCPinchToolSpeeds
    add:
    - type: RMCXenoRemoved
  - type: Sprite
    sprite: _RMC14/Objects/Medical/Surgery/hemostat.rsi
    state: hemostat
  - type: RMCSurgeryStepXenoHeartEffect
