# Put base tools at the bottom of whichever set if they are a parent.
# Incision
- type: entity
  id: RMCIncisionToolSpeeds
  categories: [ HideSpawnMenu ]
  components:
  - type: SurgeryToolMultipliers
    multipliers:
    - tool:
      - type: RMCScalpelManager
      multiplier: 1
    - tool:
      - type: RMCLaserScalpel
      multiplier: 1
    - tool:
      - type: CMScalpel
      multiplier: 1
    # TODO: PICT system 1.2, bayonet 1.4, kitchen knife 1.4, throwing knife 1.8, glass shard 1.8

