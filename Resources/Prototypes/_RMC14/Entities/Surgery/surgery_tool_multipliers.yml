# Put base tools at the bottom of whichever set if they are a parent.
# Incision
- type: entity
  id: RMCIncisionToolSpeeds
  categories: [ HideSpawnMenu ]
  components:
  - type: SurgeryToolMultipliers
    multipliers:
    - tool:
      - type: RMCScalpelManager
      multiplier: 1
    - tool:
      - type: RMCLaserScalpel
      multiplier: 1
    - tool:
      - type: CMScalpel
      multiplier: 1
    - tool:
      - type: RMCSurgeryBayonet
      multiplier: 1.4
    - tool:
      - type: RMCSurgeryKitchenKnife
      multiplier: 1.4
    - tool:
      - type: RMCSurgeryThrowingKnife
      multiplier: 1.8
    - tool:
      - type: RMCSurgeryGlassShard
      multiplier: 1.8
    # TODO: PICT system 1.2

